version: '3.8'

services:
  # FalkorDB Primary Graph Database
  falkordb:
    image: falkordb/falkordb:latest-alpine
    container_name: chainsentry-falkordb
    ports:
      - "6379:6379"
    volumes:
      - falkordb_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ChainSentry FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: chainsentry-backend
    ports:
      - "8000:8000"
    environment:
      - FALKORDB_HOST=falkordb
      - FALKORDB_PORT=6379
      - FALKORDB_GRAPH_NAME=chainsentry
      - HOST=0.0.0.0
      - PORT=8000
    depends_on:
      falkordb:
        condition: service_healthy
    restart: unless-stopped

  # ChainSentry React Web Dashboard
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: chainsentry-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  falkordb_data:
